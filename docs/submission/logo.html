<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:512px;height:512px;overflow:hidden;background:transparent}
.bg{position:absolute;inset:0;border-radius:112px;background:radial-gradient(circle at 30% 20%,#1b2a55,#0a0f24 70%)}
.card{position:absolute;left:146px;top:86px;width:220px;height:306px;border-radius:30px;background:linear-gradient(160deg,#5b3fd1,#c0478f);box-shadow:0 18px 50px rgba(91,63,209,.55),inset 0 0 0 5px rgba(255,255,255,.18)}
.card::after{content:"";position:absolute;inset:18px;border-radius:18px;border:3px dashed rgba(255,255,255,.28)}
.body{position:absolute;left:206px;top:226px;width:100px;height:80px;border-radius:16px;background:#fff}

</style></head><body><div class="bg"></div><div class="card"></div><div class="shackle"></div><div class="body"></div><div class="hole"></div><div class="drop"></div><div class="check">✓</div></body></html>
