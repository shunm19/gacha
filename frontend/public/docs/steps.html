<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>10口のBlindオリパ — 抽選から検証まで</title>
<style>
  :root {
    --ink: #172d43; --muted: #647180; --rule: #e5eaf0;
    --blue: #4DA2FF; --blue-ink: #1769b5;
    --commit: #8172c7; --seal: #4DA2FF; --random: #238f99; --reveal: #c77450;
    --S: #d99a06; --A: #c43fa8; --B: #2f7fd6; --C: #7b8794;
    --sealed-a: #5b3fd1; --sealed-b: #b04a8f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #fff; }
  body { font-family: "Hiragino Sans", "Noto Sans JP", sans-serif; color: var(--ink); }
  main { position: relative; width: 1920px; height: 1080px; padding: 44px 56px 0; }
  h1 { margin: 0; font-size: 42px; line-height: 56px; font-weight: 800; letter-spacing: -0.5px; }
  h1 .brand { color: var(--blue-ink); }
  .sub { margin: 4px 0 0; font-size: 21px; line-height: 32px; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(3, 590px); grid-template-rows: repeat(2, 408px); gap: 22px 23px; margin-top: 22px; }
  .panel { position: relative; border: 1px solid var(--rule); border-radius: 18px; padding: 18px 20px 16px; background: #fbfcfe; }
  .head { display: flex; align-items: center; gap: 12px; height: 38px; }
  .step { flex: none; width: 38px; height: 38px; border-radius: 50%; background: var(--blue-ink); color: #fff; font-weight: 800; font-size: 20px; line-height: 38px; text-align: center; }
  .title { font-size: 23px; font-weight: 800; white-space: nowrap; }
  .tags { margin-left: auto; display: flex; gap: 6px; }
  .tag { font-size: 13px; line-height: 22px; padding: 0 9px; border-radius: 11px; color: #fff; white-space: nowrap; font-weight: 700; }
  .t-commit { background: var(--commit); } .t-seal { background: var(--seal); } .t-random { background: var(--random); } .t-reveal { background: var(--reveal); }
  .boxes { display: flex; gap: 6px; margin: 16px 0 12px; height: 84px; }
  .box { position: relative; width: 49px; height: 70px; border-radius: 9px; font-weight: 800; text-align: center; }
  .box .no { position: absolute; left: 0; right: 0; bottom: -18px; font-size: 13px; color: var(--muted); font-weight: 700; }
  .box.sealed { background: linear-gradient(160deg, var(--sealed-a), var(--sealed-b)); color: #fff; }
  .box.sealed .lock { position: absolute; left: 50%; top: 24px; width: 18px; height: 14px; margin-left: -9px; border-radius: 3px; background: rgba(255,255,255,.9); }
  .box.sealed .lock::before { content: ""; position: absolute; left: 3px; top: -9px; width: 8px; height: 9px; border: 2px solid rgba(255,255,255,.9); border-bottom: 0; border-radius: 7px 7px 0 0; }
  .box.card { background: #fff; border: 3px solid var(--C); }
  .box.card .tier { display: block; margin-top: 8px; font-size: 26px; line-height: 30px; }
  .box.card .nm { display: block; font-size: 10px; line-height: 12px; color: var(--ink); font-weight: 700; padding: 0 2px; overflow: hidden; white-space: nowrap; }
  .box.S { border-color: var(--S); } .box.S .tier { color: var(--S); }
  .box.A { border-color: var(--A); } .box.A .tier { color: var(--A); }
  .box.B { border-color: var(--B); } .box.B .tier { color: var(--B); }
  .box.C { border-color: var(--C); } .box.C .tier { color: var(--C); }
  .box.drawn { opacity: .55; }
  .box.private { box-shadow: 0 0 0 3px #fff, 0 0 0 6px var(--seal); }
  .box.left { outline: 3px dashed #e3a21a; outline-offset: 3px; }
  .owner { position: absolute; top: -9px; right: -9px; width: 24px; height: 24px; border-radius: 50%; background: var(--ink); color: #fff; font-size: 12px; line-height: 24px; font-weight: 800; }
  .ok { position: absolute; top: -9px; left: -9px; width: 22px; height: 22px; border-radius: 50%; background: #27a55d; color: #fff; font-size: 13px; line-height: 22px; }
  .cap { font-size: 17.5px; line-height: 27px; min-height: 108px; }
  .cap b { color: var(--blue-ink); }
  .who { position: absolute; left: 20px; right: 20px; bottom: 16px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .who div { border-radius: 10px; padding: 6px 10px; font-size: 14px; line-height: 20px; background: #eef1f5; color: #4b5866; min-height: 54px; }
  .who div b { display: block; font-size: 13px; color: var(--muted); }
  .who .yes { background: #e6f5ec; color: #1d6b40; }
  .who .part { background: #fff5dc; color: #7a5a06; }
  .legend { position: absolute; left: 56px; right: 56px; bottom: 22px; display: flex; gap: 26px; align-items: center; font-size: 16px; color: var(--muted); }
  .legend .box { transform: scale(.55); margin: -16px -12px; }
  .legend span.item { display: flex; align-items: center; gap: 4px; }
  .note { margin-left: auto; font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>10口の Blind オリパ — 中身を知るのは<span class="brand">運営と引いた本人だけ</span>、残り3口で<span class="brand">全員が検証</span>できる</h1>
  <p class="sub">運営は自分で詰めたので中身を知っている。できないのは「次の箱を決める」「中身を後から変える」「結果を隠し続ける」こと。</p>
  <div class="grid" id="grid"></div>
  <div class="legend">
    <span class="item"><span class="box sealed"><span class="lock"></span></span>封印中（中身は暗号）</span>
    <span class="item"><span class="box card S private"><span class="tier">S</span></span>本人だけが復号して見ている</span>
    <span class="item"><span class="box card B"><span class="tier">B</span></span>全員が見られる</span>
    <span class="item"><span class="box sealed drawn"><span class="lock"></span><span class="owner">A</span></span>引かれた箱（丸は引いた人）</span>
    <span class="item"><span class="box sealed left"><span class="lock"></span></span>残りの箱</span>
    <span class="note">前提：Seal の鍵サーバー（閾値）が運営と結託しないこと ・ ETHGlobal Tokyo 2026 · Sui</span>
  </div>
</main>
<script>
// Hidden mapping (box -> card) the operator packed at step 1.
const CARD = {
  0: ["C", "チルタリス"], 1: ["B", "カミツレ"], 2: ["C", "ゴースト"], 3: ["S", "ピカチュウ"], 4: ["C", "ミミッキュ"],
  5: ["B", "ピカチュウ"], 6: ["C", "アブリボン"], 7: ["A", "ナンジャモ"], 8: ["B", "ゲンガー"], 9: ["C", "ピカチュウ"],
};
// Draw order and who drew: A draws #7 first, then others.
const ORDER = [[7, "A"], [2, "B"], [9, "C"], [0, "D"], [5, "E"], [4, "F"], [8, "G"]];
const drawnBy = (n) => Object.fromEntries(ORDER.slice(0, n));

function box(i, mode, opts = {}) {
  const [tier, name] = CARD[i];
  const owner = opts.owner ? `<span class="owner">${opts.owner}</span>` : "";
  const ok = opts.ok ? `<span class="ok">✓</span>` : "";
  const cls = [opts.drawn ? "drawn" : "", opts.left ? "left" : "", opts.private ? "private" : ""].join(" ");
  if (mode === "sealed") return `<div class="box sealed ${cls}"><span class="lock"></span>${owner}<span class="no">#${i}</span></div>`;
  return `<div class="box card ${tier} ${cls}"><span class="tier">${tier}</span><span class="nm">${name}</span>${owner}${ok}<span class="no">#${i}</span></div>`;
}

const who = (op, me, others) =>
  `<div class="who"><div class="${op[0]}"><b>運営</b>${op[1]}</div><div class="${me[0]}"><b>引いた人</b>${me[1]}</div><div class="${others[0]}"><b>ほかの人</b>${others[1]}</div></div>`;

const steps = [
  {
    title: "運営が10個の箱に詰める", tags: [["t-commit", "sha256"], ["t-seal", "Seal暗号化"]],
    boxes: () => [...Array(10).keys()].map((i) => box(i, "sealed")),
    cap: "景品一覧（S1・A1・B3・C5）は公開。各箱には中身の<b>封印（ハッシュ）</b>を貼り、中身のメモは<b>Seal で暗号化</b>してチェーンに置く。後から中身を差し替えると封印と合わなくなる。",
    who: who(["yes", "全部の中身（自分で詰めた）"], ["", "—"], ["part", "景品一覧と箱の数だけ"]),
  },
  {
    title: "Aさんが1回引く", tags: [["t-random", "sui::random"]],
    boxes: () => [...Array(10).keys()].map((i) => box(i, "sealed", i === 7 ? { owner: "A", drawn: true } : {})),
    cap: "代金を払うと <b>sui::random</b> が残り10箱から1つを選ぶ（例：#7）。並び順は存在しないので、<b>運営も次の箱を決められず、予測もできない</b>。チェーンに出るのは「#7が引かれた」だけ。",
    who: who(["part", "#7 の中身も分かる（自分で詰めた）／次の箱は決められない"], ["", "まだ中身を見ていない"], ["", "「#7が引かれた」だけ"]),
  },
  {
    title: "Aさんだけが #7 を開ける", tags: [["t-seal", "Seal 本人ポリシー"]],
    boxes: () => [...Array(10).keys()].map((i) => (i === 7 ? box(i, "card", { owner: "A", private: true }) : box(i, "sealed"))),
    cap: "Seal の鍵サーバーが「#7 の引換券を持っているか」をチェーンで確かめてから鍵を出す → <b>Aさんだけが復号</b>（A ナンジャモ）。手元で封印と一致も確認。ほかの人には見えない。",
    who: who(["part", "全部知っている → 残り9箱の中身も分かる（唯一の情報差）"], ["yes", "#7 の中身だけ"], ["", "中身は見えない"]),
  },
  {
    title: "2〜7回目も同じ", tags: [["t-random", "sui::random"], ["t-seal", "Seal"]],
    boxes: () => { const d = drawnBy(7); return [...Array(10).keys()].map((i) => box(i, "sealed", d[i] ? { owner: d[i], drawn: true } : { left: true })); },
    cap: "毎回、残りの箱から <b>sui::random</b> で1つ。各自は<b>自分の箱だけ</b>復号できる。周りから見えるのは、どの箱が引かれたかだけ。残りは #1・#3・#6 の3箱。",
    who: who(["part", "引かれた7箱も残り3箱も中身が分かる"], ["yes", "自分の箱だけ"], ["", "引かれた箱の番号だけ"]),
  },
  {
    title: "残り3口 → 全員が開けられる", tags: [["t-seal", "Seal 公開ポリシー"]],
    boxes: () => { const d = drawnBy(7); return [...Array(10).keys()].map((i) => box(i, "card", d[i] ? { owner: d[i], drawn: true } : { left: true })); },
    cap: "残り ≤ 3 がチェーン上で成立した瞬間、<b>誰でも10箱すべてを復号</b>できる（引かれた箱も残りの箱も）。S ピカチュウが<b>まだ残っていると全員に分かる</b>ので、運営だけが知っていて自分で買う、ができない。",
    who: who(["yes", "全部（ほかの人と同じ）"], ["yes", "全部"], ["yes", "全部"]),
  },
  {
    title: "運営の言い分を検証する", tags: [["t-commit", "sha256"], ["t-reveal", "reveal + 担保"]],
    boxes: () => { const d = drawnBy(7); return [...Array(10).keys()].map((i) => box(i, "card", { owner: d[i], drawn: !!d[i], ok: true })); },
    cap: "最初は運営の言い分を信じるしかなかった中身を、①<b>各箱が最初の封印と一致</b> ②<b>景品一覧が1枚ずつ入っていた</b>、の2点で誰でも確認できる。チェーンに公開（reveal）すると発送依頼ができ、隠したままなら最高額を担保から支払い。",
    who: who(["yes", "隠すと損（最高額を支払い）"], ["yes", "検証して発送依頼"], ["yes", "誰でも検証できる"]),
  },
];

document.getElementById("grid").innerHTML = steps.map((s, k) => `
  <section class="panel">
    <div class="head"><div class="step">${k + 1}</div><div class="title">${s.title}</div>
      <div class="tags">${s.tags.map(([c, t]) => `<span class="tag ${c}">${t}</span>`).join("")}</div></div>
    <div class="boxes">${s.boxes().join("")}</div>
    <div class="cap">${s.cap}</div>
    ${s.who}
  </section>`).join("");
</script>
</body>
</html>
